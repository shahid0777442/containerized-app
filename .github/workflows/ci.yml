name: CI/CD - Build, Scan, Push

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write          # GHCR par push ke liye

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------- Job 1: har image build + vulnerability scan (+ push) ----------
  build-scan-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    env:
      REGISTRY: ghcr.io
      IMAGE: ghcr.io/${{ github.repository }}/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v3

      - name: Image tags/labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # Scan ke liye local build (push nahi)
      - name: Build (local, for scan)
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          target: runtime
          load: true
          push: false
          tags: scan/${{ matrix.service }}:ci
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: scan/${{ matrix.service }}:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"          # serious fixable vulnerability mile to pipeline fail

      - name: Login to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # auto-provided, manual secret ki zaroorat nahi

      - name: Build & push to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}

  # ---------- Job 2: poora stack chala kar smoke test ----------
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Prepare env + secret
        run: |
          cp .env.example .env
          printf 'ci-test-password' > secrets/db_password.txt

      - name: Start stack
        run: docker compose up -d --build --wait --wait-timeout 180

      - name: Test endpoints
        run: |
          curl -fsS http://localhost:8080/healthz
          curl -fsS http://localhost:8080/api/visits

      - name: Security checks
        run: |
          # data tier host par exposed nahi honi chahiye
          ! curl -s -m 2 localhost:5432 >/dev/null
          ! curl -s -m 2 localhost:6379 >/dev/null
          # non-root
          docker compose exec -T backend id -u | grep -vx 0
          # password env mein nahi
          ! docker compose exec -T backend env | grep -E '^DB_PASSWORD=.+'

      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Cleanup
        if: always()
        run: docker compose down -v
