# Use: GHCR_REPO=owner/repo docker compose -f docker-compose.yml -f docker-compose.ghcr.yml pull
#      GHCR_REPO=owner/repo docker compose -f docker-compose.yml -f docker-compose.ghcr.yml up -d --no-build
services:
  backend:
    image: ghcr.io/${GHCR_REPO}/backend:latest
  frontend:
    image: ghcr.io/${GHCR_REPO}/frontend:latest
