<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Containerized App</title>
    <style>
      body { font-family: system-ui, sans-serif; display: grid; place-items: center; min-height: 100vh; margin: 0; background: #0f172a; color: #e2e8f0; }
      .card { background: #1e293b; padding: 2rem 3rem; border-radius: 12px; text-align: center; }
      h1 { margin-top: 0; } .num { font-size: 2.5rem; font-weight: 700; color: #38bdf8; }
      button { padding: .6rem 1.2rem; border: 0; border-radius: 8px; background: #38bdf8; color: #0f172a; cursor: pointer; font-weight: 600; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Container Stack Demo</h1>
      <p>PostgreSQL total visits</p><div class="num" id="db">-</div>
      <p>Redis API hits</p><div class="num" id="redis">-</div>
      <button id="btn">Refresh</button>
      <p id="err" style="color:#f87171"></p>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
