
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password   # password env mein nahi, file se
    secrets: [db_password]
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [backend_net]                               # host par koi port publish nahi
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks: [backend_net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      target: runtime
    image: containerized-app/backend:1.0.0
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_USER: ${DB_USER}
      DB_NAME: ${DB_NAME}
      DB_PASSWORD_FILE: /run/secrets/db_password
      REDIS_URL: redis://cache:6379
    secrets: [db_password]
    depends_on:
      db:    { condition: service_healthy }
      cache: { condition: service_healthy }
    networks: [backend_net]            # sirf internal network; internet/host se direct access nahi
    read_only: true                    # filesystem read-only
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

  frontend:
    build:
      context: ./frontend
      target: runtime
    image: containerized-app/frontend:1.0.0
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - "${WEB_PORT:-8080}:8080"       # HOST:CONTAINER  <- yeh wahid public entry point hai
    networks: [frontend_net, backend_net]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]

networks:
  frontend_net: {}
  backend_net:
    internal: true                     # is network se bahar internet access nahi

volumes:
  pgdata:

secrets:
  db_password:
    file: ./secrets/db_password.txt
